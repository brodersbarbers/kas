<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BroDers Keuangan</title>
    
    <!-- PWA Requirements -->
    <meta name="theme-color" content="#9B1C31">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { poppins: ['Poppins', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { barber: { maroon: '#9B1C31', dark: '#6A0C1C', light: '#C2183D' } },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; margin: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; background: #f8fafc; position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.6); }
        .font-outfit { font-family: 'Outfit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .shine-maroon { background: linear-gradient(135deg, #C2183D, #9B1C31, #6A0C1C); color: white; box-shadow: 0 10px 25px -5px rgba(155, 28, 49, 0.4); }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-top: 1px solid rgba(255, 255, 255, 0.6); }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); }
        .modern-input { width: 100%; background: transparent; border: none; outline: none; font-size: 2.5rem; font-weight: 700; color: #0f172a; text-align: center; font-family: 'Outfit', sans-serif; }
        .category-radio:checked + label { background: linear-gradient(135deg, #C2183D, #9B1C31); color: white; border-color: transparent; box-shadow: 0 8px 20px rgba(155, 28, 49, 0.3); transform: translateY(-2px); }
        .category-radio:checked + label i { color: white; }
        .category-radio-exp:checked + label { background: #1e293b; color: white; border-color: transparent; box-shadow: 0 8px 20px rgba(30, 41, 59, 0.3); transform: translateY(-2px); }
        .category-radio-exp:checked + label i { color: white; }
        .toast { transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        
        /* Loader */
        .loader { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- TAMPILAN LOGIN -->
    <div id="login-view" class="app-container z-50 flex flex-col justify-center items-center px-8 bg-white bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iNDAwIj48ZGVmcz48cGF0dGVybiBpZD0icCIgd2lkdGg9IjIwIiBoZWlnaHQ9IjIwIiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48Y2lyY2xlIGN4PSIyIiBjeT0iMiIgcj0iMiIgZmlsbD0iI2YxZjViOSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNwKSIvPjwvc3ZnPg==')]">
        
        <div class="w-24 h-24 rounded-full shine-maroon flex items-center justify-center text-5xl mb-6 shadow-2xl ring-8 ring-white animate-slide-up">
            <i class="ph-bold ph-scissors"></i>
        </div>
        
        <h1 class="text-4xl font-black text-gray-800 font-outfit mb-1 animate-slide-up" style="animation-delay: 0.1s">Bro<span class="text-barber-maroon">Ders</span></h1>
        <p class="text-gray-500 text-sm font-medium mb-10 tracking-widest uppercase animate-slide-up" style="animation-delay: 0.2s">Management System</p>

        <div class="w-full space-y-4 animate-slide-up" style="animation-delay: 0.3s">
            <div>
                <label class="text-[11px] font-bold text-gray-500 mb-1.5 block uppercase tracking-wide">Username</label>
                <div class="relative">
                    <i class="ph-fill ph-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                    <input type="text" id="login-user" class="w-full bg-white border border-gray-200 rounded-2xl pl-12 pr-4 py-4 text-sm outline-none focus:border-barber-maroon focus:ring-2 focus:ring-barber-maroon/20 font-medium" placeholder="Masukkan username">
                </div>
            </div>
            <div>
                <label class="text-[11px] font-bold text-gray-500 mb-1.5 block uppercase tracking-wide">Password</label>
                <div class="relative">
                    <i class="ph-fill ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                    <input type="password" id="login-pass" class="w-full bg-white border border-gray-200 rounded-2xl pl-12 pr-4 py-4 text-sm outline-none focus:border-barber-maroon focus:ring-2 focus:ring-barber-maroon/20 font-medium" placeholder="••••••••">
                </div>
            </div>
            
            <button onclick="handleLogin()" id="btn-login" class="w-full shine-maroon py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 shadow-xl shadow-barber-maroon/30 transition-transform active:scale-95 mt-8">
                Masuk Sistem <i class="ph-bold ph-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- TAMPILAN APLIKASI UTAMA -->
    <div id="app-main" class="app-container hidden">
        
        <header class="px-6 pt-12 pb-5 bg-white/70 backdrop-blur-xl border-b border-white rounded-b-[2.5rem] shadow-sm z-10 relative flex justify-between items-center">
            <div>
                <h1 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1" id="header-subtitle">Halo, <span id="user-name-display">User</span></h1>
                <h2 class="text-3xl font-extrabold text-gray-800 tracking-tight font-outfit" id="header-title">Bro<span class="text-barber-maroon">Ders</span></h2>
            </div>
            <button onclick="logout()" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 shadow-sm ring-2 ring-white active:scale-95">
                <i class="ph-bold ph-sign-out text-lg"></i>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar pb-32 relative" id="main-content">
            
            <!-- VIEW: DASHBOARD (Hanya Owner) -->
            <div id="view-dashboard" class="view-section px-6 py-5 space-y-6 hidden">
                <div class="flex items-center justify-between glass-card px-5 py-3.5 rounded-2xl">
                    <div class="flex items-center gap-3 text-barber-maroon">
                        <i class="ph-bold ph-calendar-blank text-lg"></i>
                        <span class="text-[11px] font-bold uppercase tracking-widest text-gray-500">Periode</span>
                    </div>
                    <input type="month" id="month-selector" class="bg-transparent text-sm font-extrabold text-gray-800 outline-none font-outfit" onchange="changePeriod(this.value)">
                </div>

                <div class="shine-maroon rounded-[2rem] p-7 relative">
                    <p class="text-white/80 text-xs font-medium mb-1">Saldo Bersih Bulan Ini</p>
                    <h3 class="text-4xl font-black text-white mb-6 font-outfit" id="dash-balance">Rp 0</h3>
                    <div class="flex justify-between border-t border-white/20 pt-4 mt-2">
                        <div class="flex-1">
                            <p class="text-white/70 text-[10px] mb-1 flex items-center gap-1 font-medium uppercase"><i class="ph-bold ph-arrow-down-left text-green-300"></i> Pemasukan</p>
                            <p class="text-white font-bold text-sm font-outfit" id="dash-income">Rp 0</p>
                        </div>
                        <div class="flex-1 text-right">
                            <p class="text-white/70 text-[10px] mb-1 flex items-center justify-end gap-1 font-medium uppercase"><i class="ph-bold ph-arrow-up-right text-red-300"></i> Pengeluaran</p>
                            <p class="text-white font-bold text-sm font-outfit" id="dash-expense">Rp 0</p>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-end mb-4 px-2">
                        <h4 class="font-bold text-gray-800 text-sm">Riwayat Terakhir</h4>
                        <button onclick="fetchData()" class="text-[10px] font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded-full"><i class="ph-bold ph-arrows-clockwise"></i> Refresh</button>
                    </div>
                    <div id="transaction-list" class="space-y-3">
                        <div class="text-center py-5"><div class="loader !border-barber-maroon !border-t-transparent"></div></div>
                    </div>
                </div>
            </div>

            <!-- VIEW: INPUT (Semua Role) -->
            <div id="view-input" class="view-section px-6 py-5 hidden">
                <div class="flex bg-gray-200/80 p-1.5 rounded-2xl mb-6 backdrop-blur-md">
                    <button class="flex-1 py-3 text-sm font-bold rounded-xl bg-white text-barber-maroon shadow-md transition-all" id="btn-tab-inc" onclick="toggleInputType('income')">Pemasukan</button>
                    <button class="flex-1 py-3 text-sm font-bold rounded-xl text-gray-500 transition-all" id="btn-tab-exp" onclick="toggleInputType('expense')">Pengeluaran</button>
                </div>

                <div class="glass-card rounded-[2rem] p-7 mb-6">
                    <p class="text-center text-gray-500 text-xs font-bold uppercase mb-2" id="input-amount-label">Jumlah</p>
                    <div class="flex items-center justify-center gap-2 mb-8 border-b-2 border-gray-100 pb-4">
                        <span class="text-2xl font-bold text-gray-400 font-outfit">Rp</span>
                        <input type="text" id="input-amount" class="modern-input" placeholder="0" oninput="formatRupiahInput(this)">
                    </div>

                    <p class="text-gray-800 text-sm font-bold mb-4 flex items-center gap-2"><i class="ph-fill ph-tag text-barber-maroon"></i> Pilih Kategori</p>
                    
                    <div class="grid grid-cols-3 gap-3 mb-8" id="grid-inc-cat">
                        <!-- Pemasukan -->
                        <div class="cat-wrap"><input type="radio" name="input-category" value="Cukur Rambut" class="category-radio hidden" checked><label class="flex flex-col items-center justify-center p-3 rounded-2xl border bg-white/50 text-gray-600 cursor-pointer"><i class="ph ph-scissors text-2xl mb-1"></i><span class="text-[10px] font-bold">Cukur</span></label></div>
                        <div class="cat-wrap"><input type="radio" name="input-category" value="Cuci & Styling" class="category-radio hidden"><label class="flex flex-col items-center justify-center p-3 rounded-2xl border bg-white/50 text-gray-600 cursor-pointer"><i class="ph ph-drop text-2xl mb-1"></i><span class="text-[10px] font-bold">Cuci</span></label></div>
                        <div class="cat-wrap"><input type="radio" name="input-category" value="Produk" class="category-radio hidden"><label class="flex flex-col items-center justify-center p-3 rounded-2xl border bg-white/50 text-gray-600 cursor-pointer"><i class="ph ph-package text-2xl mb-1"></i><span class="text-[10px] font-bold">Produk</span></label></div>
                    </div>

                    <div class="grid grid-cols-3 gap-3 mb-8 hidden" id="grid-exp-cat">
                        <!-- Pengeluaran -->
                        <div class="cat-wrap"><input type="radio" name="input-category" value="Makan" class="category-radio-exp hidden" disabled><label class="flex flex-col items-center justify-center p-3 rounded-2xl border bg-white/50 text-gray-600 cursor-pointer"><i class="ph ph-fork-knife text-2xl mb-1"></i><span class="text-[10px] font-bold">Makan</span></label></div>
                        <div class="cat-wrap"><input type="radio" name="input-category" value="Listrik/Air" class="category-radio-exp hidden" disabled><label class="flex flex-col items-center justify-center p-3 rounded-2xl border bg-white/50 text-gray-600 cursor-pointer"><i class="ph ph-lightning text-2xl mb-1"></i><span class="text-[10px] font-bold">Listrik</span></label></div>
                        <div class="cat-wrap"><input type="radio" name="input-category" value="Lainnya" class="category-radio-exp hidden" disabled><label class="flex flex-col items-center justify-center p-3 rounded-2xl border bg-white/50 text-gray-600 cursor-pointer"><i class="ph ph-dots-three text-2xl mb-1"></i><span class="text-[10px] font-bold">Lainnya</span></label></div>
                    </div>

                    <input type="text" id="input-note" placeholder="Catatan (opsional)..." class="w-full bg-white/80 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-barber-maroon/50">
                </div>

                <button onclick="saveTransaction()" id="btn-save" class="w-full shine-maroon py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 shadow-xl active:scale-95">
                    <i class="ph-bold ph-check-circle text-2xl"></i> Simpan Data
                </button>
            </div>

            <!-- VIEW: LAINNYA (Abaikan detail isi untuk space, logika UI Laporan/Gaji ada di sini, disembunyikan utk karyawan) -->
            <div id="view-laporan" class="view-section px-6 py-5 hidden">
                 <h3 class="font-bold text-gray-800 text-lg mb-4">Fitur Laporan (Hanya Owner)</h3>
                 <!-- ... Struktur Laporan Sama Seperti Sebelumnya ... -->
            </div>
            <div id="view-gaji" class="view-section px-6 py-5 hidden">
                 <h3 class="font-bold text-gray-800 text-lg mb-4">Fitur Slip Gaji (Hanya Owner)</h3>
            </div>

        </main>

        <!-- Navigasi Bawah -->
        <nav id="bottom-nav" class="absolute bottom-0 w-full glass-nav rounded-t-[2.5rem] px-5 py-3 flex justify-between items-center z-20 pb-6 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
            <button onclick="switchTab('dashboard')" class="nav-btn-owner nav-btn flex flex-col items-center gap-1.5 text-barber-maroon w-[20%]" data-target="dashboard">
                <i class="ph-fill ph-squares-four text-[26px]"></i>
                <span class="text-[9px] font-bold">Beranda</span>
            </button>
            
            <button onclick="switchTab('laporan')" class="nav-btn-owner nav-btn flex flex-col items-center gap-1.5 text-gray-400 w-[20%]" data-target="laporan">
                <i class="ph-bold ph-chart-bar text-[26px]"></i>
                <span class="text-[9px] font-semibold">Laporan</span>
            </button>

            <div class="w-[20%] flex justify-center -mt-12 relative z-30">
                <button onclick="switchTab('input')" class="nav-btn w-[60px] h-[60px] shine-maroon rounded-full flex justify-center items-center shadow-xl ring-[6px] ring-[#F8FAFC]" data-target="input">
                    <i class="ph-bold ph-plus text-[28px] text-white"></i>
                </button>
            </div>
            
            <button onclick="switchTab('gaji')" class="nav-btn-owner nav-btn flex flex-col items-center gap-1.5 text-gray-400 w-[20%]" data-target="gaji">
                <i class="ph-bold ph-receipt text-[26px]"></i>
                <span class="text-[9px] font-semibold">Gaji</span>
            </button>
            
            <button class="flex flex-col items-center gap-1.5 text-gray-300 w-[20%]">
                <i class="ph-bold ph-user text-[26px]"></i>
                <span class="text-[9px] font-semibold">Profil</span>
            </button>
        </nav>

        <div id="toast" class="toast fixed top-6 left-1/2 -translate-x-1/2 -translate-y-[200%] bg-gray-900/95 text-white px-6 py-3.5 rounded-full shadow-2xl flex items-center gap-3 z-50">
            <i class="ph-fill ph-check-circle text-green-400 text-xl" id="toast-icon"></i>
            <span class="text-sm font-semibold tracking-wide" id="toast-msg">Tersimpan!</span>
        </div>
    </div>

    <script>
        /**
         * PASTE URL WEB APP DARI GOOGLE APPS SCRIPT DI SINI
         */
        const API_URL = "https://script.google.com/macros/s/AKfycbya9gnb54HehCPhgt4O7kxSvVvrLS7P_TXsCSznY7lLOOrcY0c0Eza-4M1aDjIyGh3A/exec";
        
        let currentUser = JSON.parse(localStorage.getItem('barber_user')) || null;
        let selectedPeriod = new Date().toISOString().slice(0, 7); 
        let currentInputType = 'income';
        let transactions = [];

        // --- PWA Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW Registered!', reg))
            .catch(err => console.error('SW Error', err));
        }

        const showToast = (msg, isError = false) => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').className = isError ? "ph-fill ph-warning-circle text-red-400 text-xl" : "ph-fill ph-check-circle text-green-400 text-xl";
            toast.style.transform = 'translate(-50%, 0)';
            setTimeout(() => toast.style.transform = 'translate(-50%, -200%)', 2500);
        };

        const formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
        const parseRupiah = (str) => parseInt(str.replace(/[^,\d]/g, '')) || 0;
        const formatRupiahInput = (input) => {
            let val = input.value.replace(/[^,\d]/g, '');
            input.value = new Intl.NumberFormat('id-ID').format(val);
        };

        // --- LOGIN LOGIC ---
        window.onload = () => {
            document.getElementById('month-selector').value = selectedPeriod;
            if (currentUser) {
                initApp();
            } else {
                document.getElementById('login-view').classList.remove('hidden');
            }
        };

        const handleLogin = async () => {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const btn = document.getElementById('btn-login');
            
            if(!user || !pass) return showToast('Isi Username & Password!', true);
            
            btn.innerHTML = '<div class="loader"></div> Memproses...';
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username: user, password: pass })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    localStorage.setItem('barber_user', JSON.stringify(data.user));
                    currentUser = data.user;
                    initApp();
                } else {
                    showToast(data.message, true);
                    btn.innerHTML = 'Masuk Sistem <i class="ph-bold ph-arrow-right"></i>';
                }
            } catch (err) {
                showToast("Gagal koneksi ke server", true);
                btn.innerHTML = 'Masuk Sistem <i class="ph-bold ph-arrow-right"></i>';
            }
        };

        const logout = () => {
            localStorage.removeItem('barber_user');
            location.reload();
        };

        const initApp = () => {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-main').classList.remove('hidden');
            document.getElementById('user-name-display').innerText = currentUser.name;

            if (currentUser.role === 'karyawan') {
                // Sembunyikan menu navigasi khusus owner
                document.querySelectorAll('.nav-btn-owner').forEach(el => el.classList.add('hidden'));
                // Otomatis arahkan ke Input
                switchTab('input');
            } else {
                // Owner
                document.querySelectorAll('.nav-btn-owner').forEach(el => el.classList.remove('hidden'));
                switchTab('dashboard');
            }
        };

        // --- NAVIGATION & UI ---
        const switchTab = (tabId) => {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.target !== 'input') {
                    const isTarget = btn.dataset.target === tabId;
                    btn.classList.toggle('text-barber-maroon', isTarget);
                    btn.classList.toggle('text-gray-400', !isTarget);
                }
            });

            if(tabId === 'dashboard' && currentUser.role === 'owner') fetchData();
        };

        const toggleInputType = (type) => {
            currentInputType = type;
            const isInc = type === 'income';
            
            document.getElementById('grid-inc-cat').classList.toggle('hidden', !isInc);
            document.getElementById('grid-exp-cat').classList.toggle('hidden', isInc);
            
            document.getElementById('btn-tab-inc').className = isInc ? "flex-1 py-3 text-sm font-bold rounded-xl bg-white text-barber-maroon shadow-md" : "flex-1 py-3 text-sm font-bold rounded-xl text-gray-500";
            document.getElementById('btn-tab-exp').className = !isInc ? "flex-1 py-3 text-sm font-bold rounded-xl bg-gray-800 text-white shadow-md" : "flex-1 py-3 text-sm font-bold rounded-xl text-gray-500";
            
            const btnSave = document.getElementById('btn-save');
            if(isInc) {
                btnSave.className = "w-full shine-maroon py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 shadow-xl";
                btnSave.innerHTML = '<i class="ph-bold ph-check-circle text-2xl"></i> Simpan Pemasukan';
                document.getElementById('grid-inc-cat').querySelectorAll('input').forEach(i => i.disabled = false);
            } else {
                btnSave.className = "w-full bg-gray-800 text-white py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 shadow-xl";
                btnSave.innerHTML = '<i class="ph-bold ph-minus-circle text-2xl"></i> Catat Pengeluaran';
                document.getElementById('grid-exp-cat').querySelectorAll('input').forEach(i => i.disabled = false);
            }
        };

        // --- API INTEGRATION ---
        const changePeriod = (val) => { selectedPeriod = val; fetchData(); };

        const fetchData = async () => {
            if(currentUser.role !== 'owner') return;
            document.getElementById('transaction-list').innerHTML = '<div class="text-center py-5"><div class="loader !border-barber-maroon !border-t-transparent"></div></div>';
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getData', month: selectedPeriod })
                });
                const response = await res.json();
                
                if(response.status === 'success') {
                    transactions = response.data;
                    updateDashboardUI();
                }
            } catch (error) {
                showToast("Gagal mengambil data", true);
            }
        };

        const updateDashboardUI = () => {
            let inc = 0, exp = 0;
            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '';

            transactions.forEach(t => {
                if(t.type === 'income') inc += t.amount; else exp += t.amount;
            });

            document.getElementById('dash-balance').innerText = formatRupiah(inc - exp);
            document.getElementById('dash-income').innerText = formatRupiah(inc);
            document.getElementById('dash-expense').innerText = formatRupiah(exp);

            if(transactions.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-center text-gray-500 py-5">Belum ada transaksi.</p>`;
            } else {
                transactions.slice(0, 10).forEach(t => {
                    const isInc = t.type === 'income';
                    const icon = isInc ? 'ph-trend-up text-green-500 bg-green-100' : 'ph-trend-down text-red-500 bg-red-100';
                    const color = isInc ? 'text-green-600' : 'text-gray-800';
                    const d = new Date(t.date);
                    const time = `${d.getDate()} ${d.toLocaleDateString('id',{month:'short'})}`;

                    listEl.innerHTML += `
                    <div class="glass-card flex items-center justify-between p-4 rounded-2xl mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center ${icon}"><i class="ph-bold ${icon.split(' ')[0]}"></i></div>
                            <div>
                                <p class="text-sm font-bold text-gray-800">${t.category}</p>
                                <p class="text-[10px] text-gray-500">${time} • ${t.username}</p>
                            </div>
                        </div>
                        <p class="text-sm font-black font-outfit ${color}">${isInc?'+':'-'} ${formatRupiah(t.amount)}</p>
                    </div>`;
                });
            }
        };

        const saveTransaction = async () => {
            const amount = parseRupiah(document.getElementById('input-amount').value);
            const categoryEl = document.querySelector('input[name="input-category"]:checked');
            const note = document.getElementById('input-note').value;
            const btn = document.getElementById('btn-save');

            if (amount <= 0 || !categoryEl) return showToast("Nominal & Kategori Wajib Diisi!", true);

            btn.innerHTML = '<div class="loader"></div> Menyimpan...';
            btn.disabled = true;

            const payload = {
                action: 'addTransaction',
                type: currentInputType,
                amount: amount,
                category: categoryEl.value,
                note: note,
                username: currentUser.username
            };

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                
                if(result.status === 'success') {
                    document.getElementById('input-amount').value = '';
                    document.getElementById('input-note').value = '';
                    showToast("Berhasil Disimpan!");
                    
                    if(currentUser.role === 'owner') {
                        setTimeout(() => { switchTab('dashboard'); fetchData(); }, 1000);
                    } else {
                        // Karyawan tetap di halaman input
                        toggleInputType(currentInputType); // reset button state
                    }
                }
            } catch (error) {
                showToast("Gagal menyimpan data", true);
                toggleInputType(currentInputType); // reset button state
            }
            btn.disabled = false;
        };
    </script>
</body>
</html>
